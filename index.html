<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Für dich ❤️</title>

</head>

<body>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: radial-gradient(circle at top, #ffccd5, transparent 35%), linear-gradient(135deg, #ff9a9e, #8b0000);
            font-family: "Georgia", serif;
            overflow: hidden;
            animation: hintergrund 10s infinite alternate;
        }
        
        @keyframes hintergrund {
            from {
                filter: hue-rotate(0deg);
            }
            to {
                filter: hue-rotate(25deg);
            }
        }
        
        #start {
            text-align: center;
            color: white;
        }
        
        #start h1 {
            font-size: 32px;
            margin-bottom: 35px;
        }
        
        button {
            padding: 16px 40px;
            border: none;
            border-radius: 50px;
            background: #e91e63;
            color: white;
            font-size: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .3);
            transition: .3s;
        }
        
        button:active {
            transform: scale(.9);
        }
        
        #laden {
            display: none;
            color: white;
            font-size: 25px;
        }
        
        #brief {
            display: none;
            width: 100%;
            max-width: 450px;
            max-height: 85vh;
            overflow-y: auto;
            background: rgba(255, 255, 255, .9);
            backdrop-filter: blur(15px);
            padding: 30px 22px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, .5);
            box-shadow: 0 25px 60px rgba(0, 0, 0, .4);
            animation: karte 2s ease;
        }
        
        @keyframes karte {
            from {
                opacity: 0;
                transform: translateY(80px) scale(.8);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        .brief h1 {
            text-align: center;
            color: #a0003c;
            font-size: 30px;
            margin-bottom: 25px;
        }
        
        p {
            color: #333;
            font-size: 17px;
            line-height: 1.8;
            white-space: pre-wrap;
        }
        
        #cursor {
            animation: blinken .7s infinite;
        }
        
        @keyframes blinken {
            50% {
                opacity: 0;
            }
        }
        
        .herz {
            position: fixed;
            bottom: -40px;
            animation: fliegen linear forwards;
            pointer-events: none;
        }
        
        @keyframes fliegen {
            from {
                transform: translateY(0) rotate(0);
                opacity: 1;
            }
            to {
                transform: translateY(-120vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        #ende {
            display: none;
            text-align: center;
            color: white;
            animation: ende 2s;
        }
        
        @keyframes ende {
            from {
                opacity: 0;
                transform: scale(.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .grossesHerz {
            font-size: 120px;
            animation: puls 1s infinite;
        }
        
        @keyframes puls {
            50% {
                transform: scale(1.2);
            }
        }
        
        @media(max-width:600px) {
            #start h1 {
                font-size: 26px;
            }
            .brief {
                padding: 25px 18px;
                border-radius: 25px;
            }
            .brief h1 {
                font-size: 26px;
            }
            p {
                font-size: 16px;
                line-height: 1.7;
            }
            .grossesHerz {
                font-size: 90px;
            }
        }
    </style>

    <div class="sterne"></div>

    <div id="start">
        <h1>Eine Nachricht für dich ❤️</h1>
        <button onclick="oeffnen()">Öffnen ❤️</button>
    </div>


    <div id="laden">
        Eine kleine Überraschung<span id="punkte"></span>
    </div>


    <div class="brief" id="brief">

        <h1>Für dich ❤️</h1>

        <p>
            <span id="text"></span><span id="cursor">|</span>
        </p>

    </div>


    <div id="ende">

        <div class="grossesHerz">
            ❤️
        </div>

        <h2>
            Du bist mein Lieblingsmensch ❤️
        </h2>

        <p>
            Danke, dass es dich gibt ❤️
        </p>

    </div>


    <script>
        const brief = `Ich weiß gar nicht, wie ich anfangen soll, weil Worte eigentlich gar nicht reichen, um zu beschreiben, wie viel du mir bedeutest und wie sehr ich dich liebe ❤️.

Seit i di hab, gibt es so viele Tage, die einfach schöner sind. Nicht weil immer etwas Besonderes passiert, sondern einfach, weil i weiß, dass i di hab. Und die schönsten Tage sind imma die, die i mit dir verbringen darf.

Und weißt du wieso? Weil einfach alles an dir perfekt is. Deine Augen, dein Lächeln, dein Charakter, deine Art zu lachen und wie du mich glücklich machst – einfach alles an dir.

Ich liebe nicht nur die großen Dinge an dir, sondern vor allem die kleinen Sachen, die wir gemeinsam erleben. Wenn wir zusammen lachen, reden oder einfach nur Zeit miteinander verbringen. Genau diese Momente bedeuten mir mehr als alles andere auf der Welt.

I werd nie vergessen, wie wir uns des erste Mal umarmt haben. Wir waren beide so nervös, aber danach war i einfach so glücklich. Ich bin so froh, dass dieser Moment passiert ist und dass wir jetzt zusammen sind ❤️.

Danke, dass du an meiner Seite bist und mein Leben schöner machst. I bin so froh, dass i di hab. Du machst einfach mein ganzes Leben schöner.

Und vergiss nie: Du bist ständig in meinem Kopf und in meinem Herzen. Ich habe noch nie so eine starke Liebe gefühlt wie für dich.

Egal, was noch kommt, i will noch unendlich viele Momente mit dir erleben, mit dir lachen und einfach glücklich sein. Weil i weiß, dass ich mit dir den richtigen Menschen an meiner Seite hab.

I hab dich echt so lieb ❤️❤️
Du bedeutest mir echt alles ❤️❤️❤️`;

        let stelle = 0;

        const text = document.getElementById("text");
        const cursor = document.getElementById("cursor");


        function oeffnen() {

            document.getElementById("start").style.display = "none";

            document.getElementById("laden").style.display = "block";


            setTimeout(() => {

                document.getElementById("laden").style.display = "none";

                document.getElementById("brief").style.display = "block";

                schreiben();

                setInterval(herzErzeugen, 300);

            }, 2500);

        }



        function schreiben() {

            if (stelle < brief.length) {

                text.textContent += brief.charAt(stelle);

                document.getElementById("brief").scrollTo({
                    top: document.getElementById("brief").scrollHeight,
                    behavior: "smooth"
                });

                let tempo = 45;


                if (
                    brief[stelle] === "." ||
                    brief[stelle] === "!" ||
                    brief[stelle] === "?"
                ) {
                    tempo = 400;
                }


                if (brief[stelle] === "\n") {
                    tempo = 700;
                }


                stelle++;


                setTimeout(schreiben, tempo);

            } else {

                cursor.style.display = "none";


                setTimeout(() => {

                    document.getElementById("brief").style.display = "none";

                    document.getElementById("ende").style.display = "block";

                    vieleHerzen();

                }, 3000);

            }

        }



        function herzErzeugen() {

            const herzen = [
                "❤️",
                "💕",
                "💗",
            ];


            const herz = document.createElement("div");

            herz.className = "herz";

            herz.innerHTML =
                herzen[Math.floor(Math.random() * herzen.length)];


            herz.style.left =
                Math.random() * 100 + "vw";


            herz.style.fontSize =
                (20 + Math.random() * 35) + "px";


            herz.style.animationDuration =
                (4 + Math.random() * 5) + "s";


            document.body.appendChild(herz);


            setTimeout(() => {

                herz.remove();

            }, 9000);

        }



        function vieleHerzen() {

            for (let i = 0; i < 40; i++) {

                setTimeout(() => {

                    herzErzeugen();

                }, i * 100);

            }

        }
    </script>

</body>

</html>
